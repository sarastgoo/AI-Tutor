[project]
name = "ai-english-tutor"
version = "0.1.0"
description = "Local-first bilingual AI English Tutor"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ali", email = "ali.rastgou1360@gmail.com"}]
dependencies = [
    # P0 runtime deps (already installed)
    "pymupdf>=2.0",
    "sentence-transformers>=6.0",
    "paddlepaddle>=3.3",
    "paddleocr>=3.7",
    "faster-whisper>=1.2",
    "piper-tts>=1.8",
    "requests>=2.34",
    "psutil>=7.2",
    "av>=18,<19",
    # P1 backend deps
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "structlog>=24.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "frontend", "scripts", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "^backend/alembic/versions/",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:paddle.*",
    "ignore::FutureWarning:fitz.*",
    "ignore::FutureWarning:sentence_transformers.*",
    "ignore::pytest.PytestDeprecationWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend.app"]